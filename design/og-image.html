<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate:
     firefox --headless --screenshot public/og-image.png --window-size=1200,630 file://$PWD/design/og-image.html -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "PJS"; src: url("../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2"); font-weight: 200 800; }
  @font-face { font-family: "Inter"; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0c1b24; color: #fff; font-family: "Inter", sans-serif; }
  .grid { position: absolute; right: -40px; top: 50%; width: 450px; transform: translateY(-50%); }
  .content { position: absolute; left: 80px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { font-family: "PJS", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.5px; }
  .brand span { color: #5eead4; }
  .eyebrow { margin-top: 56px; color: #5eead4; font-size: 20px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
  h1 { text-wrap: balance; margin-top: 18px; font-family: "PJS", sans-serif; font-weight: 600; font-size: 52px; line-height: 1.12; letter-spacing: -1px; }
  .sub { margin-top: 28px; max-width: 540px; color: rgba(255,255,255,.7); font-size: 24px; line-height: 1.4; }
</style>
</head>
<body>
<svg class="grid" id="grid" viewBox="0 0 12 8" aria-hidden="true"></svg>
<div class="content">
  <div class="brand">Biodatum<span>.io</span></div>
  <div class="eyebrow">Bioinformatics &amp; data consulting</div>
  <h1>Let your data support your business decisions, fast.</h1>
  <div class="sub">Genomics, data science and training for biotech companies and academic labs.</div>
</div>
<script>
  // Same deterministic heatmap as src/components/Hero.jsx
  const g = document.getElementById('grid'); let out = '';
  for (let i = 0; i < 96; i++) {
    const x = i % 12, y = Math.floor(i / 12);
    const v = Math.abs(Math.sin(x * 1.7 + y * 2.3) * Math.cos(x * 0.6 - y * 1.1));
    out += `<rect x="${x + 0.06}" y="${y + 0.06}" width="0.88" height="0.88" rx="0.12" fill="#5eead4" opacity="${0.05 + v * 0.4}"/>`;
  }
  g.innerHTML = out;
</script>
</body>
</html>
